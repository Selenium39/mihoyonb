<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "DejaVu Sans", Arial, sans-serif;
    color: #fff;
    background:
      radial-gradient(circle at 88% 12%, rgba(147, 197, 253, 0.28), transparent 42%),
      radial-gradient(circle at 8% 92%, rgba(37, 99, 235, 0.55), transparent 46%),
      linear-gradient(135deg, #1e3a8a 0%, #2563eb 52%, #3b82f6 100%);
    position: relative;
  }
  body::before {
    content: "";
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.055) 1px, transparent 1px);
    background-size: 44px 44px;
  }
  .wrap {
    position: relative; z-index: 1;
    width: 100%; height: 100%;
    display: flex; align-items: center; gap: 42px;
    padding: 0 54px;
  }
  .left { flex: 1; min-width: 0; }
  .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; }
  .brand-logo { width: 72px; height: 72px; flex-shrink: 0; }
  .brand-name { font-size: 46px; font-weight: 700; letter-spacing: 1px; white-space: nowrap; }
  .brand-slogan {
    padding-left: 14px; border-left: 2px solid rgba(255,255,255,0.35);
    font-size: 14px; line-height: 1.3; color: rgba(255,255,255,0.86);
    max-width: 150px;
  }
  h1 {
    font-size: 47px; font-weight: 700; line-height: 1.18; letter-spacing: 0.5px;
    white-space: nowrap;
    text-shadow: 0 4px 24px rgba(30, 58, 138, 0.45);
  }
  .chips { display: flex; gap: 10px; margin-top: 26px; }
  .chip {
    display: flex; align-items: center; white-space: nowrap;
    padding: 9px 15px; border-radius: 999px;
    background: rgba(255,255,255,0.13);
    border: 1px solid rgba(255,255,255,0.28);
    font-size: 15px; font-weight: 500;
  }
  .domain {
    display: inline-flex; align-items: center;
    margin-top: 32px; padding: 11px 24px;
    border-radius: 999px; border: 1.5px solid rgba(255,255,255,0.55);
    font-size: 24px; font-weight: 600; letter-spacing: 0.5px;
    background: rgba(255,255,255,0.08);
  }
  .grid {
    flex-shrink: 0;
    display: grid; grid-template-columns: repeat(3, 164px);
    grid-auto-rows: 92px; gap: 14px;
  }
  .card {
    border-radius: 18px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.26);
    box-shadow: 0 8px 24px rgba(30, 58, 138, 0.25);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px;
  }
  .card svg { width: 30px; height: 30px; }
  .card .name { font-size: 16px; font-weight: 600; color: rgba(255,255,255,0.96); white-space: nowrap; }
</style>
</head>
<body>
<div class="wrap">
  <div class="left">
    <div class="brand">
      <svg class="brand-logo" viewBox="0 0 512 512">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
            <stop offset="1" stop-color="#ffffff" stop-opacity="0.82"/>
          </linearGradient>
        </defs>
        <rect width="512" height="512" rx="112" fill="url(#bg)"/>
        <g>
          <path d="M200 234 C 158 226 130 198 132 148" fill="none" stroke="#2563EB" stroke-width="30" stroke-linecap="round"/>
          <path d="M312 234 C 354 226 382 198 380 148" fill="none" stroke="#2563EB" stroke-width="30" stroke-linecap="round"/>
          <path d="M256 176 C 306 176 344 202 348 242 C 350 270 347 298 341 320 C 335 350 304 372 256 372 C 208 372 177 350 171 320 C 165 298 162 270 164 242 C 168 202 206 176 256 176 Z" fill="#2563EB"/>
          <rect x="188" y="286" width="136" height="68" rx="34" fill="#BFDBFE"/>
          <ellipse cx="226" cy="320" rx="8" ry="11" fill="#1E40AF"/>
          <ellipse cx="286" cy="320" rx="8" ry="11" fill="#1E40AF"/>
          <circle cx="218" cy="244" r="11" fill="#1E40AF"/>
          <circle cx="294" cy="244" r="11" fill="#1E40AF"/>
        </g>
      </svg>
      <div class="brand-name">mihoyonb</div>
      <div class="brand-slogan">Browser tools for creators</div>
    </div>
    <h1>Every creator tool<br>in one browser tab.</h1>
    <div class="chips">
      <div class="chip">100% local processing</div>
      <div class="chip">No file uploads</div>
      <div class="chip">Free, no signup</div>
    </div>
    <div class="domain">mihoyonb.com/en</div>
  </div>
  <div class="grid">
    <div class="card">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="6" cy="6" r="1.6"/><circle cx="12" cy="6" r="1.6"/><circle cx="18" cy="6" r="1.6"/>
        <circle cx="6" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18" cy="12" r="1.6"/>
        <circle cx="6" cy="18" r="1.6"/><circle cx="12" cy="18" r="1.6"/><circle cx="18" cy="18" r="1.6"/>
      </svg>
      <div class="name">Bead Pattern</div>
    </div>
    <div class="card">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/>
        <rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/>
      </svg>
      <div class="name">Photo Collage</div>
    </div>
    <div class="card">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="6.5" cy="6.5" r="2.5"/><circle cx="6.5" cy="17.5" r="2.5"/>
        <path d="M8.5 8.5 20 20M8.5 15.5 20 4"/>
      </svg>
      <div class="name">Image Splitter</div>
    </div>
    <div class="card">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3.5c3.2 3.6 5.5 6.2 5.5 9.2a5.5 5.5 0 0 1-11 0c0-3 2.3-5.6 5.5-9.2Z"/>
      </svg>
      <div class="name">Watermark</div>
    </div>
    <div class="card">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="16" rx="2"/>
        <path d="M8 4v16M3 9h18"/>
      </svg>
      <div class="name">Social Resize</div>
    </div>
    <div class="card">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Z"/>
        <path d="M14 3v6h6M8 13h8M8 17h5"/>
      </svg>
      <div class="name">Markdown</div>
    </div>
    <div class="card">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/>
        <path d="M14 14h3v3h-3zM20 14v3M14 20h3M20 20h1"/>
      </svg>
      <div class="name">QR Code</div>
    </div>
    <div class="card">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="14" rx="2"/>
        <path d="M7 5v14M17 5v14M3 9h4M3 15h4M17 9h4M17 15h4"/>
      </svg>
      <div class="name">Video Frames</div>
    </div>
    <div class="card">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3 4.5 6v5.5c0 4.3 3 7.4 7.5 9.5 4.5-2.1 7.5-5.2 7.5-9.5V6Z"/>
        <path d="m9 12 2 2 4-4"/>
      </svg>
      <div class="name">Word Checker</div>
    </div>
  </div>
</div>
</body>
</html>
