# 临时 workflow：借 self-hosted runner（onyxus 服务器本机）执行 byos 侦察/下线。
# mihoyonb 已迁 Cloudflare Pages，用于清理旧服务，完成后整文件删除。
name: byos teardown (temporary)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'recon | delete'
        required: true
        default: 'recon'

jobs:
  run:
    runs-on: [self-hosted, byos-deploy]
    steps:
      - name: Recon byos projects on this host
        if: inputs.mode == 'recon'
        run: |
          echo "=== projects dir candidates ==="
          ls ~/src/byos-ops/projects/ 2>/dev/null || ls /data/home/src/byos-ops/projects/ 2>/dev/null || ls /home/box/src/byos-ops/projects/ 2>/dev/null
          echo ""
          for base in ~/src/byos-ops/projects /data/home/src/byos-ops/projects /home/box/src/byos-ops/projects; do
            p="$base/onyxus-mihoyonb"
            if [ -d "$p" ]; then
              echo "########## $p ##########"
              byos --project-dir "$p" get services --json || echo "(get services failed)"
            fi
          done
          echo ""
          echo "=== docker ps (running containers) ==="
          docker ps --format '{{.Names}}\t{{.Image}}\t{{.Status}}' 2>/dev/null || sudo docker ps --format '{{.Names}}\t{{.Image}}\t{{.Status}}' 2>/dev/null || echo "(docker not accessible)"

      - name: Delete mihoyonb service
        if: inputs.mode == 'delete'
        run: |
          for base in ~/src/byos-ops/projects /data/home/src/byos-ops/projects /home/box/src/byos-ops/projects; do
            p="$base/onyxus-mihoyonb"
            if [ -d "$p" ]; then
              byos --project-dir "$p" delete mihoyonb -y --json
              exit 0
            fi
          done
          echo "project dir not found" >&2
          exit 1
